services:
  app:
    image: tro-case-watch:production
    build:
      context: ../..
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      ENABLE_INTERNAL_SCHEDULERS: "false"
      ENABLE_SCHEDULER: "false"
      ENABLE_BACKFILL_SCHEDULER: "false"
      BOOTSTRAP_SYNC: "false"
      WEBHOOK_ENRICHMENT_ENABLED: "true"
      WEBHOOK_ENRICHMENT_PROVIDERS: "worldtro,61tro,recentfilings,courtlistener,pacermonitor"
      WEBHOOK_ENRICHMENT_WORKER_ENABLED: "false"
      COURTLISTENER_WEBHOOK_WORKER_ENABLED: "false"
      COURTLISTENER_TIMEOUT_MS: "8000"
      COURTLISTENER_MAX_RETRIES: "1"
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=1536}
    volumes:
      - ${APP_DATA_DIR:-/var/lib/tro-case-watch/data}:/app/data
    mem_limit: 3g
    mem_reservation: 512m
    cpus: 1.5
    pids_limit: 256
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4127/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  worker:
    image: tro-case-watch:production
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_healthy
    init: true
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      PORT: "4128"
      ENABLE_INTERNAL_SCHEDULERS: "true"
      WEBHOOK_ENRICHMENT_ENABLED: "true"
      WEBHOOK_ENRICHMENT_PROVIDERS: "worldtro,61tro,recentfilings,courtlistener,pacermonitor"
      WEBHOOK_ENRICHMENT_WORKER_ENABLED: "true"
      COURTLISTENER_WEBHOOK_WORKER_ENABLED: "true"
      COURTLISTENER_WEBHOOK_MAX_BODY_BYTES: "2097152"
      COURTLISTENER_WEBHOOK_MAX_PENDING_EVENTS: "500"
      COURTLISTENER_WEBHOOK_MAX_EVENTS_PER_RUN: "5"
      COURTLISTENER_WEBHOOK_LEASE_TTL_MS: "300000"
      COURTLISTENER_WEBHOOK_RETRY_DELAY_MS: "60000"
      COURTLISTENER_WEBHOOK_MAX_ATTEMPTS: "5"
      COURTLISTENER_WEBHOOK_POLL_INTERVAL_MS: "5000"
      WEBHOOK_ENRICHMENT_MAX_OLD_SPACE_MB: "256"
      WEBHOOK_ENRICHMENT_MAX_RSS_MB: "320"
      WEBHOOK_ENRICHMENT_MIN_FREE_SYSTEM_MB: "1024"
      DISCOVERY_ENRICHMENT_PROVIDERS: "courtlistener,pacermonitor,worldtro,61tro,recentfilings"
      DISCOVERY_ENRICHMENT_DELAY_MS: "60000"
      DOCKET_COMPLETION_SCHEDULER_ENABLED: "true"
      DOCKET_COMPLETION_SCHEDULER_INTERVAL_MS: "600000"
      DOCKET_COMPLETION_SCHEDULER_BOOTSTRAP_DELAY_MS: "120000"
      DOCKET_COMPLETION_MAX_CASES_PER_RUN: "8"
      DOCKET_COMPLETION_RETRY_DELAY_MS: "21600000"
      DOCKET_COMPLETION_QUEUE_DELAY_MS: "45000"
      DOCKET_COMPLETION_RECENT_WINDOW_DAYS: "365"
      DOCKET_COMPLETION_PROVIDERS: "worldtro,61tro,recentfilings,courtlistener,pacermonitor"
      SIGNAL_FEED_ENABLED: "false"
      PRIORITY_FEED_SCHEDULER_INTERVAL_MS: "1200000"
      PRIORITY_FEED_SCHEDULER_BOOTSTRAP_DELAY_MS: "60000"
      COURTLISTENER_TIMEOUT_MS: "8000"
      COURTLISTENER_MAX_RETRIES: "1"
      COURTLISTENER_ENABLE_DOCKET_ALERTS: "true"
      COURTLISTENER_DOCKET_ALERT_SYNC_MAX_CASES_PER_RUN: "5"
      COURTLISTENER_ALERT_SCHEDULER_INTERVAL_MS: "1800000"
      COURT_FEEDS_TARGETS: "all"
      COURT_FEEDS_MAX_FEEDS_PER_RUN: "8"
      COURT_FEEDS_MAX_LOOKUPS_PER_RUN: "1"
      COURT_FEEDS_SCHEDULER_INTERVAL_MS: "600000"
      COURT_FEEDS_TIMEOUT_MS: "8000"
      COURT_FEEDS_CROSS_SOURCE_FOLLOW_UP_MAX_CASES_PER_RUN: "0"
      RECENT_FILINGS_MAX_LOOKUPS_PER_RUN: "1"
      RECENT_FILINGS_MAX_SOURCES_PER_RUN: "1"
      RECENT_FILINGS_MAX_PAGES_PER_COURT: "1"
      RECENT_FILINGS_TIMEOUT_MS: "8000"
      RECENT_FILINGS_SCHEDULER_INTERVAL_MS: "600000"
      LAW_FIRM_SITES_MAX_CASES_PER_SOURCE: "2"
      LAW_FIRM_SITES_MAX_LOOKUPS_PER_RUN: "1"
      LAW_FIRM_SITES_MAX_SOURCES_PER_RUN: "1"
      LAW_FIRM_SITES_TIMEOUT_MS: "8000"
      LAW_FIRMS_SCHEDULER_INTERVAL_MS: "600000"
      PACERMONITOR_MAX_CASES_PER_RUN: "1"
      PACERMONITOR_MAX_SEARCH_QUERIES: "2"
      PACERMONITOR_SCHEDULER_INTERVAL_MS: "900000"
      NODE_OPTIONS: ${WORKER_NODE_OPTIONS:---max-old-space-size=1280}
    volumes:
      - ${APP_DATA_DIR:-/var/lib/tro-case-watch/data}:/app/data
    mem_limit: 2500m
    mem_reservation: 512m
    cpus: 0.75
    pids_limit: 192
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4128/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  caddy:
    image: caddy:2
    init: true
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    pids_limit: 64
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
